# Video Server configuration.
# All ports are configurable here and are NOT hardcoded in the source.

server:
  # Public host used to build RTSP / WebRTC / HLS URLs shown in the UI and API.
  # "auto" (or 0.0.0.0) = advertise this machine's LAN IPv4, so the URLs work
  # from other computers. Set an explicit IP/DNS name if you proxy the service.
  host: auto
  http_port: 8080
  # Listen address for HTTP. 0.0.0.0 = serve the SAME port on every IPv4 the
  # machine has (LAN, Wi-Fi, VPN), which is what makes it reachable from the
  # network. Use 127.0.0.1 to go back to local-only.
  bind: 0.0.0.0

rtsp:
  port: 8554

webrtc:
  port: 8889

database:
  path: data/video.db

mediamtx:
  # Path to the MediaMTX binary.
  # Windows: ./mediamtx/mediamtx.exe  (the manager appends .exe automatically)
  # Linux:   ./mediamtx/mediamtx
  # NOTE: local dev override -> binary installed at D:\data\agent-tools
  # (on system PATH, but the server needs an explicit path to launch it).
  binary: mediamtx.exe
  # Config file generated by the server on every start (unique temp name inside
  # this directory, so it never clobbers a checked-in file). Lives under data/
  # (runtime state) rather than config/ (source).
  config: ./data/mediamtx.yml
  # Listen address for the media ports (RTSP / WebRTC / HLS). 0.0.0.0 lets
  # cameras and players on the LAN push and pull.
  bind: 0.0.0.0
  # Listen address of the MediaMTX CONTROL API. Loopback on purpose: only this
  # server polls it, and exposing it would hand the whole LAN full control over
  # every stream. Change to 0.0.0.0 only if you know why you need it.
  api_bind: 127.0.0.1
  # WebRTC ICE listeners (UDP + TCP). TCP matters for phones: it keeps WebRTC
  # working when UDP between the phone and this box is blocked.
  ice_udp_port: 8189
  ice_tcp_port: 8189
  # RTP/RTCP UDP ports MediaMTX receives media on. They are configurable so a
  # second server can run side by side, and so a box where 8000/8001 are already
  # taken (another MediaMTX, some other RTP sink) does not make the child die
  # with "bind: Only one usage of each socket address".
  rtp_port: 8000
  rtcp_port: 8001
  # MediaMTX control API port (used for camera auto-discovery).
  api_port: 9997
  # HLS port. The server also proxies it at /hls/<stream>/index.m3u8 so the web
  # UI can fall back to HLS on the same origin (and the same firewall rule).
  hls_port: 8888

# AI metadata ingest: camera-agent pushes detection results and AI heartbeats
# to POST /api/metadata. Nothing here touches the media path - if the agent
# stops sending, or sends garbage, RTSP/WebRTC/HLS keep running untouched.
metadata:
  enabled: true
  # Detected-object rows kept PER CAMERA. At ~5 frames/s that is a few minutes
  # of history. The latest frame and the latest heartbeat are always kept,
  # regardless of this value.
  # 0 or negative disables pruning - the table then grows without bound.
  retention_rows: 2000
  # Reject oversized payloads before decoding them (bytes).
  max_body_bytes: 1048576
  # Reject messages for cameras the monitor has not registered yet.
  # Keep this false: metadata routinely arrives BEFORE the monitor's next 3s
  # poll, so requiring a known camera only makes the agent back off for nothing.
  require_known_camera: false

log:
  level: info   # debug | info | warn | error
  # file: data/video-server.log   # optional; logs go to stdout if omitted
