# Video Server configuration.
# All ports are configurable here and are NOT hardcoded in the source.

server:
  # Public host used to build RTSP / WebRTC URLs shown in the UI and API.
  # "auto" advertises this machine's LAN IPv4 so the URLs work elsewhere.
  host: auto
  http_port: 8090
  # 0.0.0.0 = same port on every local IPv4 (LAN reachable).
  bind: 0.0.0.0

rtsp:
  port: 8554

webrtc:
  port: 8889

database:
  path: data/video.db

mediamtx:
  # Path to the MediaMTX binary.
  # Windows: ./mediamtx/mediamtx.exe  (the manager appends .exe automatically)
  # Linux:   ./mediamtx/mediamtx
  # NOTE: local dev override -> binary installed at D:\data\agent-tools
  # (on system PATH, but the server needs an explicit path to launch it).
  binary: mediamtx.exe
  # Config file generated by the server on every start (unique temp name inside
  # this directory, so it never clobbers a checked-in file). Lives under data/
  # (runtime state) rather than config/ (source).
  config: ./data/mediamtx.yml
  # Media ports listen on all interfaces; control API stays on loopback.
  bind: 0.0.0.0
  api_bind: 127.0.0.1
  # MediaMTX control API port (used for camera auto-discovery).
  api_port: 9998
  # HLS port (optional; exposed for completeness).
  hls_port: 8888

log:
  level: info   # debug | info | warn | error
  # file: data/video-server.log   # optional; logs go to stdout if omitted
